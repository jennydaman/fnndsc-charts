suite: config.yml config.setSecurityContext
templates:
  - config.yml
tests:
  - it: should set CONTAINER_USER to '1001:0' by default (non-OpenShift)
    asserts:
      - equal:
          path: data.CONTAINER_USER
          value: '1001:0'
  - it: should allow CONTAINER_USER to be set
    set:
      extraEnv.CONTAINER_USER: '20202:0'
    asserts:
      - equal:
          path: data.CONTAINER_USER
          value: '20202:0'
  - it: should set CONTAINER_USER to the value of global.podSecurityContext
    set:
      global.podSecurityContext.runAsUser: 50505
      global.podSecurityContext.runAsGroup: 303
    asserts:
      - equal:
          path: data.CONTAINER_USER
          value: '50505:303'
  - it: should prioritize containerSecurityContext over podSecurityContext, and deprioritize global
    set:
      global.podSecurityContext.runAsUser: 10000 # ignored because non-global value is set
      global.containerSecurityContext.runAsGroup: 20000 # accepted
      podSecurityContext.runAsUser: 30000 # accepted
      podSecurityContext.runAsGroup: 40000 # ignored because global.containerSecurityContext takes priority
    asserts:
      - equal:
          path: data.CONTAINER_USER
          value: '30000:20000'
