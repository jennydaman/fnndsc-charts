# Default values for pfcon.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

global:
  # -- Global default StorageClass for Persistent Volume(s)
  defaultStorageClass: ""

  # -- optional security context to apply to all pods
  podSecurityContext: {}
    # runAsUser: 123456
    # runAsGroup: 789

  # -- optional security context to apply to all containers
  containerSecurityContext: {}
    # runAsUser: 123456
    # runAsGroup: 789

# -- deployment replicas
replicaCount: 1

annotations: {}

podAnnotations: {}

podSecurityContext: {}

containerSecurityContext: {}

service:
  type: ClusterIP
  port: 5005

storage:
  existingClaim: ""
  size: 8Gi
  accessModes: [ "ReadWriteOnce" ]
  storageClass: ""

nodeSelector: {}

image:
  repository: ghcr.io/fnndsc/pfcon
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# -- pfcon password. If left blank, either the previous value will be used,
# -- or a value will be randomly generated.
password:

# -- flask secret key. If unset, either the previous value will be obtained from the Kubernetes API,
# -- or a value will be randomly generated.
secretKey:

# -- Extra environment variables. Supports templating.
# -- Some of the default values here assume pfcon is being used as a subchart
# -- for fnndsc/chris.
# -- https://github.com/FNNDSC/pfcon#environment-variables
extraEnv:
  # -- "In-network" mode. Set as "false" if deploying pfcon as standalone
  # -- (i.e. not as a subchart of fnndsc/chris)
  PFCON_INNETWORK: 'true'
  # -- Storage mode. Options: fslink, filesystem, zipfile.
  STORAGE_ENV: '{{ eq .Values.extraEnv.PFCON_INNETWORK "true" | ternary "fslink" "zipfile" }}'
  # -- Set `CONTAINER_ENV=kubernetes`
  CONTAINER_ENV: 'kubernetes'
  # -- Set `COMPUTE_VOLUME_TYPE=kubernetes_pvc`
  COMPUTE_VOLUME_TYPE: 'kubernetes_pvc'

  # -- Name of k8s namespace where to create Jobs.
  JOB_NAMESPACE: '{{ .Release.Namespace }}'
  # -- Name of k8s PersistentVolumeClaim where to store data.
  VOLUME_NAME: '{{ include "pfcon.storebase" . }}'
  # -- Set securityContext on created jobs. The default value is a template
  # -- which, if running in OpenShift, set as empty string, leaving control
  # -- of the securityContext to the OpenShift. Otherwise, sets the value as
  # -- "1001:0" which is the hard-coded default user in the ghcr.io/fnndsc/cube
  # -- container.
  CONTAINER_USER: >-
    {{- $uid := .Values.containerSecurityContext.runAsUser | default .Values.global.containerSecurityContext.runAsUser | default .Values.podSecurityContext.runAsUser | default .Values.global.podSecurityContext.runAsUser | default nil }}
    {{- $gid := .Values.containerSecurityContext.runAsGroup | default .Values.global.containerSecurityContext.runAsGroup | default .Values.podSecurityContext.runAsGroup | default .Values.global.podSecurityContext.runAsGroup | default nil }}
    {{- if (or $uid $gid) -}}
      {{- printf "%d:%d" ($uid | default 1001 | int64) ($gid | default 0 | int64) -}}
    {{- else if not (.Capabilities.APIVersions.Has "security.openshift.io/v1/SecurityContextConstraints") -}}
      1001:0
    {{- end -}}
  # -- Image to use for pfcon data copy/upload/delete jobs.
  PFCON_OP_IMAGE: 'ghcr.io/fnndsc/pfconopjob:{{ .Chart.AppVersion }}'

  GUNICORN_CMD_ARGS: '--workers=4 --timeout=300'
  JOB_LABELS: 'chrisproject.org/job=plugininstance'
  ENABLE_HOME_WORKAROUND: 'yes'
  REMOVE_JOBS: 'yes'
  IGNORE_LIMITS: 'no'

# -- pfcon container hostPort.
hostPort:

# -- WIP support for `podman kube play`
podman:
  enabled: false
  socket:
