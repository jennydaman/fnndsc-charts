suite: config.yml setSecurityContext (OpenShift)
capabilities:
  apiVersions:
    - security.openshift.io/v1/SecurityContextConstraints
templates:
  - config.yml
tests:
  - it: should set empty value for CONTAINER_USER on OpenShift
    asserts:
      - equal:
          path: data.CONTAINER_USER
          value: ''
  - it: should set CONTAINER_USER to the value of global.podSecurityContext
    set:
      global.podSecurityContext.runAsUser: 50505
      global.podSecurityContext.runAsGroup: 303
    asserts:
      - equal:
          path: data.CONTAINER_USER
          value: '50505:303'
